name: Deploy Spring Boot

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Build Application
    run: mvn clean package -DskipTests

  - name: Copy JAR to Oracle VM
    uses: appleboy/scp-action@v0.1.7
    with:
      host: ${{ secrets.VM_HOST }}
      username: ${{ secrets.VM_USER }}
      key: ${{ secrets.VM_SSH_KEY }}
      source: "target/email-service-0.0.1-SNAPSHOT.jar"
      target: "/home/ubuntu/apps/email-service/"
      strip_components: 1

  - name: Deploy and Restart
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.VM_HOST }}
      username: ${{ secrets.VM_USER }}
      key: ${{ secrets.VM_SSH_KEY }}
      script: |
        sudo systemctl restart email-service
        sleep 10
        sudo systemctl status email-service --no-pager

  - name: Health Check
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.VM_HOST }}
      username: ${{ secrets.VM_USER }}
      key: ${{ secrets.VM_SSH_KEY }}
      script: |
        curl -f http://localhost:8080/actuator/health
```
