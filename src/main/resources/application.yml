spring:
  application:
    name: email-service

  config:
    import: "aws-parameterstore:/innogeeks/email-service/"

  cloud:
    aws:
      region:
        static: us-east-1

  datasource:
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

aws:
  access-key: ${aws-access-key}
  secret-key: ${aws-secret-key}

logging:
  level:
    io.awspring.cloud: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always